---
name: Super-Linter

on:
  push:
    branches: ['**']

jobs:
  build:
    name: Lint Code Base
    runs-on: ubuntu-latest

    permissions:
      contents: read
      statuses: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Full git history is needed to get a proper
          # list of changed files within `super-linter`
          fetch-depth: 0

      - name: Run Linter
        uses: super-linter/super-linter@v8.1.0
        env:
          VALIDATE_JSCPD_ALL_CODEBASE: true
          YAML_ERROR_ON_WARNING: true
          # Disable problematic security checks that are too strict for this project
          VALIDATE_CHECKOV: false
          VALIDATE_GITHUB_ACTIONS_ZIZMOR: false
          # Disable formatting checks that conflict with existing style
          VALIDATE_JSON_PRETTIER: false
          VALIDATE_MARKDOWN_PRETTIER: false
          VALIDATE_YAML_PRETTIER: false
          VALIDATE_NATURAL_LANGUAGE: false
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
