---
# GitHub Copilot Setup Steps
# This file configures the environment setup steps that run before firewall restrictions
# are enabled, allowing Copilot to function properly in restricted environments.
#
# See: https://gh.io/copilot/actions-setup-steps

name: "Copilot Environment Setup"
description: "Setup steps for GitHub Copilot to work effectively with the Modelling Tasks project"

steps:
  # Update package lists first
  - name: "Update package lists"
    run: "sudo apt-get update"
    
  # Install essential system dependencies required by the Haskell project
  # These are needed for building diagrams and documentation
  - name: "Install system dependencies"
    run: "sudo apt-get install -y graphviz texlive-base texlive-latex-base"
    
  # Verify installations to catch issues early
  - name: "Verify Graphviz installation"
    run: "dot -V"
    
  - name: "Verify LaTeX installation"
    run: "pdflatex --version"
    
  # Test network connectivity to required domains
  # This is critical for Haskell Stack to download dependencies
  - name: "Test network connectivity"
    run: "curl -I https://hackage.haskell.org/root.json"
    
  # Set up Stack directory permissions if needed
  - name: "Prepare Stack environment"
    run: "mkdir -p ~/.stack && chmod 755 ~/.stack"